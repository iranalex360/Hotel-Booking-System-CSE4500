<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed! | CheckIn.com</title>
  <link href="../dist/output.css" rel="stylesheet" />
</head>

<body class="bg-zinc-200 text-slate-800">

  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="./index.html" class="flex items-center">
        <img
          src="./assets/logo.png"
          alt="CheckIn.com logo"
          class="w-32 sm:w-40 md:w-48 lg:w-56 h-auto object-contain"
        />
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden items-center gap-8 md:flex">
        <a href="./index.html" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">Home</a>
        <a href="./search.html" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">Hotels</a>
        <a href="./bookings.html" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">My Bookings</a>
        <a href="./index.html#about" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">About</a>
        <div id="auth-nav"></div>
      </nav>

      <!-- Mobile Hamburger Button -->
      <button
        id="mobile-menu-btn"
        type="button"
        class="flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-300 bg-white/80 text-slate-700 shadow-sm transition hover:bg-slate-100 md:hidden"
        aria-label="Toggle Navigation Menu"
      >
        <svg id="mobile-menu-icon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <!-- Mobile Dropdown Menu Screen -->
    <div id="mobile-menu" class="hidden border-t border-slate-200 bg-white/95 px-6 py-5 shadow-2xl backdrop-blur-xl md:hidden">
      <nav class="flex flex-col space-y-2">
        <a href="./index.html" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Home
        </a>
        <a href="./search.html" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h-2m2 0h2m-2-4h2m-2 0H9m-2 4h2m-2 0H9m2-4h2m-2 0H9" />
          </svg>
          Hotels
        </a>
        <a href="./bookings.html" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          My Bookings
        </a>
        <a href="./index.html#about" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          About
        </a>

        <div id="mobile-auth-nav"></div>
      </nav>
    </div>
  </header>

  <main class="py-12 sm:py-16">
    <div class="mx-auto max-w-4xl px-4 sm:px-6">

      <div id="confirmation-container" class="rounded-[2.5rem] bg-white p-8 shadow-xl sm:p-12">
        <div class="text-center">
          <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 text-emerald-600">
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          
          <span class="inline-block rounded-full bg-emerald-100 px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-emerald-700">
            Reservation Confirmed
          </span>

          <h1 class="mt-4 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">
            You're all set!
          </h1>
          
          <p class="mt-2 text-slate-500">
            Loading your booking receipt...
          </p>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-12 bg-white">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-8 md:flex-row md:items-center md:justify-between">
      <a href="./index.html" class="flex items-center">
        <img
          src="./assets/logo.png"
          alt="CheckIn.com logo"
          class="w-32 sm:w-40 h-auto object-contain"
        />
      </a>

      <p class="text-sm text-slate-500">
        Hotel Booking System Project • Tailwind CSS • Node.js • PostgreSQL
      </p>
    </div>
  </footer>

  <script src="./js/navbar.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/booking-confirmation.js"></script>
</body>
</html>
