<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Details | CheckIn.com</title>
  <link href="../dist/output.css" rel="stylesheet" />
</head>
<body class="bg-zinc-200 text-slate-800">

  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <a href="./index.html" class="flex items-center">
        <img
          src="./assets/logo.png"
          alt="CheckIn.com logo"
          class="w-32 sm:w-40 md:w-48 lg:w-56 h-auto object-contain"
        />
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden items-center gap-8 md:flex">
        <a href="./search.html" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">Hotels</a>
        <a href="./index.html#why-us" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">Why us?</a>
        <a href="./index.html#about" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">About</a>
        <a href="./index.html#contact" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">Contact</a>
        <a href="./bookings.html" class="text-sm font-semibold text-slate-700 transition hover:text-sky-500">My Bookings</a>

        <div id="auth-nav"></div>
      </nav>

      <!-- Mobile Hamburger Button -->
      <button
        id="mobile-menu-btn"
        type="button"
        class="flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-300 bg-white/80 text-slate-700 shadow-sm transition hover:bg-slate-100 md:hidden"
        aria-label="Toggle Navigation Menu"
      >
        <svg id="mobile-menu-icon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <!-- Mobile Dropdown Menu Screen -->
    <div id="mobile-menu" class="hidden border-t border-slate-200 bg-white/95 px-6 py-5 shadow-2xl backdrop-blur-xl md:hidden">
      <nav class="flex flex-col space-y-2">
        <a href="./search.html" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h-2m2 0h2m-2-4h2m-2 0H9m-2 4h2m-2 0H9m2-4h2m-2 0H9" />
          </svg>
          Search Hotels
        </a>
        <a href="./bookings.html" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          My Bookings
        </a>
        <a href="./index.html#why-us" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
          </svg>
          Why us?
        </a>
        <a href="./index.html#about" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          About
        </a>
        <a href="./index.html#contact" class="flex items-center gap-3 rounded-2xl bg-slate-50 px-4 py-3 text-base font-bold text-slate-800 transition hover:bg-sky-50 hover:text-sky-600">
          <svg class="h-5 w-5 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
          Contact
        </a>

        <div id="mobile-auth-nav"></div>
      </nav>
    </div>
  </header>

  <main>
  <section class="relative overflow-hidden bg-zinc-200">
    <div class="mx-auto max-w-7xl px-6 py-12 sm:py-16">
      <a
        href="./search.html"
        class="mb-8 inline-block rounded-2xl bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:text-sky-600"
      >
        ← Back to Hotels
      </a>

      <div id="hotel-details-container">
        <div class="rounded-[2rem] bg-white p-8 text-center text-slate-500 shadow-sm">
          Loading hotel details...
        </div>
      </div>

      <!-- Reviews -->
      <section
        id="reviews-section"
        class="mt-10 rounded-[2rem] bg-white p-8 shadow-sm"
      >
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-sky-500">
              Guest Reviews
            </p>

            <h2 class="mt-2 text-3xl font-bold text-slate-900">
              What guests are saying
            </h2>
          </div>

          <p id="reviews-count" class="text-sm font-semibold text-slate-500">
            Loading reviews...
          </p>
        </div>

        <div
          id="reviews-container"
          class="mt-6 grid grid-cols-1 gap-5 md:grid-cols-2"
        >
          <div class="rounded-3xl bg-zinc-100 p-6 text-center text-slate-500 md:col-span-2">
            Loading reviews...
          </div>
        </div>
      </section>
    </div>
  </section>
</main>

  <footer class="bg-white">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-8 md:flex-row md:items-center md:justify-between">
      <a href="./index.html" class="flex items-center">
        <img
          src="./assets/logo.png"
          alt="CheckIn.com logo"
          class="w-32 sm:w-40 md:w-48 lg:w-56 h-auto object-contain"
        />
      </a>

      <p class="text-sm text-slate-500">
        Hotel Booking System Project • Tailwind CSS • Node.js • SQL Server
      </p>
    </div>
  </footer>

  <script src="./js/navbar.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/hotel-details.js"></script>
</body>
</html>
